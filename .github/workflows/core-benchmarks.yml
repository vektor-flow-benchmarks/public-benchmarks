name: Native benchmark matrix

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private compiler branch or full commit SHA
        required: true
        default: release/0.4.6-general-optimizer
      stage:
        description: Acceptance stage
        required: true
        default: stage1
        type: choice
        options:
          - stage1
          - stage2
      platform:
        description: Platform to benchmark
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - linux-x64
          - macos-arm64
      backend:
        description: Test the merged research policy or explicitly request a production baseline
        required: true
        default: best-validated-research
        type: choice
        options:
          - best-validated-research
          - production-baseline

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.source_ref }}-${{ inputs.stage }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.platform == 'all' && '["windows-x64","linux-x64","macos-arm64"]' || inputs.platform == 'windows-x64' && '["windows-x64"]' || inputs.platform == 'linux-x64' && '["linux-x64"]' || '["macos-arm64"]') }}
    name: ${{ matrix.target }} · ${{ inputs.stage }}
    runs-on: ${{ matrix.target == 'windows-x64' && 'windows-latest' || matrix.target == 'linux-x64' && 'ubuntu-24.04' || 'macos-15' }}
    steps:
      - name: Check out public runner
        uses: actions/checkout@v4

      - name: Check out private compiler candidate
        uses: actions/checkout@v4
        with:
          repository: svenviktorjonsson/vektor-flow
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.VKF_PRIVATE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep research evidence separate from final release acceptance
        shell: bash
        run: |
          if [[ "${{ inputs.backend }}" == "best-validated-research" && "${{ inputs.stage }}" == "stage2" ]]; then
            echo 'The research backend cannot certify production release acceptance.' >&2
            exit 1
          fi

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Rust 1.98.0
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Install Windows Clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --yes --no-progress

      - name: Configure Windows MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation not found' }
          $setup = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $environment = & cmd.exe /d /s /c "`"$setup`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
          foreach ($line in $environment) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Install Linux Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang build-essential cmake ninja-build

      - name: Verify runner architecture
        shell: bash
        run: |
          expected="${{ matrix.target == 'macos-arm64' && 'arm64' || 'x86_64' }}"
          test "$(uname -m)" = "$expected"

      - name: Build optimized private candidate
        shell: bash
        run: |
          extra_cmake=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra_cmake+=(
              "-DCMAKE_C_COMPILER=C:/Program Files/LLVM/bin/clang.exe"
              "-DCMAKE_CXX_COMPILER=C:/Program Files/LLVM/bin/clang++.exe"
              "-DCMAKE_LINKER=C:/Program Files/LLVM/bin/lld-link.exe"
            )
          fi
          cmake -S source/compiler/native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "${extra_cmake[@]}"
          cmake --build build --parallel 2 --target vkf
          "build/bin/vkf${{ runner.os == 'Windows' && '.exe' || '' }}" -v \
            | grep -Fx 'VKF 0.4.6'

      - name: Verify general lowering and runtime correctness
        shell: bash
        env:
          VKF_BYTE_VECTOR_DRIVER: ${{ github.workspace }}/build/bin/vkf-strict${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          targets=(vkf_static_index_scalarization_test vkf_invariant_matrix_reduction_test vkf_component_cache_scope_test vkf_local_liveness_test vkf_f64_dag_plan_test)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            targets+=(vkf_arm64_encoder_test vkf_arm64_slp_test vkf_arm64_byte_vector_test)
          else
            targets+=(vkf_x64_slp_test vkf_invariant_matrix_execution_test vkf_strict)
          fi
          cmake --build build --parallel 2 --target "${targets[@]}"
          for target in "${targets[@]}"; do
            if [[ "$target" == "vkf_strict" ]]; then continue; fi
            "build/bin/${target}${{ runner.os == 'Windows' && '.exe' || '' }}"
          done
          cd source
          node --test tests/js/general-optimization-only.test.mjs \
            benchmarks/core-comparison/run.test.mjs \
            tests/bootstrap/wasm-retired-algorithms.test.mjs
          if [[ "${{ runner.os }}" != "macOS" ]]; then
            node --test tests/compiler/native-byte-vector-registers.test.mjs
          fi

      - name: Select acceptance stage
        shell: bash
        run: |
          if [[ "${{ inputs.stage }}" == "stage1" ]]; then
            echo "BENCH_RUNS=10" >> "$GITHUB_ENV"
            echo "ENFORCE_RELATIVE_GATE=true" >> "$GITHUB_ENV"
          else
            echo "BENCH_RUNS=100" >> "$GITHUB_ENV"
            echo "ENFORCE_RELATIVE_GATE=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: inputs.backend == 'best-validated-research' && matrix.target != 'macos-arm64'
        with:
          python-version: '3.11'

      - name: Build and validate the changed general numeric policy
        if: inputs.backend == 'best-validated-research' && matrix.target != 'macos-arm64'
        shell: bash
        run: |
          python -m pip install --only-binary=:all: llvmlite==0.49.0
          cmake -S source/compiler/native/diagnostics/llvm-numeric -B numeric-research -DCMAKE_BUILD_TYPE=Release
          cmake --build numeric-research --config Release --target dynamic_mir_dumper fixture_dumper --parallel 2
          if [[ "$RUNNER_OS" == Windows ]]; then
            dynamic="$GITHUB_WORKSPACE/numeric-research/Release/dynamic_mir_dumper.exe"
            fixtures="$GITHUB_WORKSPACE/numeric-research/Release/fixture_dumper.exe"
          else
            dynamic="$GITHUB_WORKSPACE/numeric-research/dynamic_mir_dumper"
            fixtures="$GITHUB_WORKSPACE/numeric-research/fixture_dumper"
          fi
          python source/compiler/native/diagnostics/llvm-numeric/probe.py "$dynamic" "$fixtures" numeric-policy-proof token 10 rust
          echo "VKF_NUMERIC_SSA_DUMPER=$dynamic" >> "$GITHUB_ENV"
          echo "VKF_NUMERIC_SSA_PYTHON=python" >> "$GITHUB_ENV"

      - name: Run all five workload comparisons
        shell: bash
        env:
          VKF_BENCH_DRIVER: ${{ github.workspace }}/build/bin/vkf${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          status=0
          cd source
          for benchmark in \
            spectral-norm-large \
            fannkuch-redux-large \
            n-body-large \
            combined-kernels-large \
            combined-kernels-parallel-large
          do
            node benchmarks/core-comparison/run.mjs \
              --case="$benchmark" \
              --language=vkf,cpp,rust,zig \
              --numeric-ssa-research=${{ inputs.backend == 'best-validated-research' && 'true' || 'false' }} \
              --max-cores=2 \
              --compile-runs=1 \
              --compile-warmups=1 \
              --runs="${BENCH_RUNS}" \
              --warmups=10 \
              --process-runs=1 \
              --process-warmups=1 \
              --function-landscape-runs=0 \
              --enforce-relative-gate="${ENFORCE_RELATIVE_GATE}" \
              --relative-limit=1 \
              --output="${{ matrix.target }}-046-${{ inputs.stage }}-${benchmark}-${{ github.run_id }}" \
              || status=1
            if [[ "${{ inputs.backend }}" == "best-validated-research" ]]; then
              BENCH_CASE="$benchmark" node --input-type=module -e '
                import { benchmarkWorkRoot } from "./benchmarks/core-comparison/run.mjs";
                import { cpSync, existsSync, mkdirSync, readdirSync } from "node:fs";
                import { resolve } from "node:path";
                const target = resolve("..", "ordinary-source-policy-proof", process.env.BENCH_CASE);
                function retain(directory) {
                  if (!existsSync(directory)) return;
                  for (const entry of readdirSync(directory, { withFileTypes: true })) {
                    if (!entry.isDirectory()) continue;
                    const path = resolve(directory, entry.name);
                    if (entry.name === "numeric-ssa-research") {
                      mkdirSync(target, { recursive: true });
                      cpSync(path, target, { recursive: true });
                    } else retain(path);
                  }
                }
                retain(resolve(benchmarkWorkRoot(), process.env.BENCH_CASE));
              ' || status=1
            fi
          done
          exit "$status"

      - name: Label research timing in each readable report
        if: always() && inputs.backend == 'best-validated-research'
        shell: bash
        env:
          BENCH_RUN_ID: ${{ github.run_id }}
        run: |
          cd source
          node --input-type=module -e '
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            import { resolve } from "node:path";
            const root = resolve("benchmarks/core-comparison/results");
            for (const name of readdirSync(root)) {
              if (!name.endsWith(`-${process.env.BENCH_RUN_ID}.json`)) continue;
              const payload = JSON.parse(readFileSync(resolve(root, name), "utf8"));
              if (!payload.options.numericSsaResearch || payload.productionReleaseEvidence !== false)
                throw Error("Research report lacks an explicit evidence classification");
              const entries = payload.results.filter(row => row.language === "vkf");
              const selected = entries.map(row => `${row.case}: ${[...new Set(row.nativeRuntimeResearchReceipts.map(receipt => receipt.selected_backend))].join(", ")}`);
              const note = "**Research candidate; this report does not certify production release performance.**\n\n" +
                "Raw native-entry timing executes guarded numeric SSA where eligibility, exact checks and matched tuning pass. " +
                "AOT artifacts, process timing and compile timing use the existing native compiler.\n\n" +
                selected.join("\n\n") + "\n\n";
              const path = resolve(root, name.replace(/\.json$/, ".md"));
              const report = readFileSync(path, "utf8");
              writeFileSync(path, report.replace("# Core language benchmark\n\n", "# Core language benchmark\n\n" + note));
            }
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}-${{ inputs.stage }}
          if-no-files-found: warn
          path: |
            source/benchmarks/core-comparison/results/${{ matrix.target }}-046-${{ inputs.stage }}-*-${{ github.run_id }}.json
            source/benchmarks/core-comparison/results/${{ matrix.target }}-046-${{ inputs.stage }}-*-${{ github.run_id }}.md
      - uses: actions/upload-artifact@v4
        if: always() && inputs.backend == 'best-validated-research'
        with:
          name: ${{ matrix.target }}-changed-policy-proof
          if-no-files-found: warn
          retention-days: 1
          path: |
            numeric-policy-proof
            ordinary-source-policy-proof
