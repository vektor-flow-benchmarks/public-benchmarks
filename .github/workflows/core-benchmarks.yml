name: Native benchmark matrix

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private compiler branch or full commit SHA
        required: true
        default: release/0.4.6-general-optimizer
      stage:
        description: Acceptance stage
        required: true
        default: stage1
        type: choice
        options:
          - stage1
          - stage2
      platform:
        description: Platform to benchmark
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - linux-x64
          - macos-arm64

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.source_ref }}-${{ inputs.stage }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.platform == 'all' && '["windows-x64","linux-x64","macos-arm64"]' || inputs.platform == 'windows-x64' && '["windows-x64"]' || inputs.platform == 'linux-x64' && '["linux-x64"]' || '["macos-arm64"]') }}
    name: ${{ matrix.target }} · ${{ inputs.stage }}
    runs-on: ${{ matrix.target == 'windows-x64' && 'windows-latest' || matrix.target == 'linux-x64' && 'ubuntu-24.04' || 'macos-15' }}
    steps:
      - name: Check out public runner
        uses: actions/checkout@v4

      - name: Check out private compiler candidate
        uses: actions/checkout@v4
        with:
          repository: svenviktorjonsson/vektor-flow
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.VKF_PRIVATE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Rust 1.98.0
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Install Windows Clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --yes --no-progress

      - name: Install Linux Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang build-essential cmake ninja-build

      - name: Verify runner architecture
        shell: bash
        run: |
          expected="${{ matrix.target == 'macos-arm64' && 'arm64' || 'x86_64' }}"
          test "$(uname -m)" = "$expected"

      - name: Build optimized private candidate
        shell: bash
        run: |
          extra_cmake=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra_cmake+=("-DCMAKE_CXX_FLAGS=-mxsave" "-DCMAKE_EXE_LINKER_FLAGS=-static")
          fi
          cmake -S source/compiler/native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "${extra_cmake[@]}"
          cmake --build build --parallel 2 --target vkf
          "build/bin/vkf${{ runner.os == 'Windows' && '.exe' || '' }}" -v \
            | grep -Fx 'VKF 0.4.6'

      - name: Verify general lowering and runtime correctness
        shell: bash
        env:
          VKF_BYTE_VECTOR_DRIVER: ${{ github.workspace }}/build/bin/vkf-strict${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          targets=(vkf_static_index_scalarization_test vkf_invariant_matrix_reduction_test vkf_component_cache_scope_test)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            targets+=(vkf_arm64_encoder_test vkf_arm64_slp_test)
          else
            targets+=(vkf_x64_slp_test vkf_invariant_matrix_execution_test vkf_strict)
          fi
          cmake --build build --parallel 2 --target "${targets[@]}"
          for target in "${targets[@]}"; do
            if [[ "$target" == "vkf_strict" ]]; then continue; fi
            "build/bin/${target}${{ runner.os == 'Windows' && '.exe' || '' }}"
          done
          cd source
          node --test tests/js/general-optimization-only.test.mjs \
            benchmarks/core-comparison/run.test.mjs \
            tests/bootstrap/wasm-retired-algorithms.test.mjs
          if [[ "${{ runner.os }}" != "macOS" ]]; then
            node --test tests/compiler/native-byte-vector-registers.test.mjs
          fi

      - name: Select acceptance stage
        shell: bash
        run: |
          if [[ "${{ inputs.stage }}" == "stage1" ]]; then
            echo "BENCH_RUNS=10" >> "$GITHUB_ENV"
            echo "ENFORCE_RELATIVE_GATE=true" >> "$GITHUB_ENV"
          else
            echo "BENCH_RUNS=100" >> "$GITHUB_ENV"
            echo "ENFORCE_RELATIVE_GATE=false" >> "$GITHUB_ENV"
          fi

      - name: Run all five workload comparisons
        shell: bash
        env:
          VKF_BENCH_DRIVER: ${{ github.workspace }}/build/bin/vkf${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          status=0
          cd source
          for benchmark in \
            spectral-norm-large \
            fannkuch-redux-large \
            n-body-large \
            combined-kernels-large \
            combined-kernels-parallel-large
          do
            node benchmarks/core-comparison/run.mjs \
              --case="$benchmark" \
              --language=vkf,cpp,rust,zig \
              --max-cores=2 \
              --compile-runs=1 \
              --compile-warmups=1 \
              --runs="${BENCH_RUNS}" \
              --warmups=10 \
              --process-runs=1 \
              --process-warmups=1 \
              --function-landscape-runs=0 \
              --enforce-relative-gate="${ENFORCE_RELATIVE_GATE}" \
              --relative-limit=0.5 \
              --output="${{ matrix.target }}-046-${{ inputs.stage }}-${benchmark}-${{ github.run_id }}" \
              || status=1
          done
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}-${{ inputs.stage }}
          if-no-files-found: warn
          path: |
            source/benchmarks/core-comparison/results/${{ matrix.target }}-046-${{ inputs.stage }}-*-${{ github.run_id }}.json
            source/benchmarks/core-comparison/results/${{ matrix.target }}-046-${{ inputs.stage }}-*-${{ github.run_id }}.md
