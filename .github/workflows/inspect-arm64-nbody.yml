name: Inspect ARM64 n-body codegen

on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        default: release/0.4.6-general-optimizer

permissions:
  contents: read

jobs:
  assembly:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check out private compiler candidate
        uses: actions/checkout@v4
        with:
          repository: svenviktorjonsson/vektor-flow
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.VKF_PRIVATE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          path: source
      - name: Emit Apple ARM64 assembly
        run: |
          clang++ -O3 -march=native -std=c++17 \
            -ffp-contract=off -fno-fast-math \
            -S source/benchmarks/core-comparison/published/n-body-large/cpp.cpp \
            -o nbody-apple-arm64.s
          clang++ -O3 -march=native -std=c++17 \
            -ffp-contract=off -fno-fast-math \
            -S source/benchmarks/core-comparison/published/fannkuch-redux-large/cpp.cpp \
            -o fannkuch-apple-arm64.s
      - uses: actions/upload-artifact@v4
        with:
          name: core-apple-arm64-assembly
          path: |
            nbody-apple-arm64.s
            fannkuch-apple-arm64.s
